// gRPC API for the social network (HLD: gRPC services).
//
// Authentication: send `authorization: Bearer <access token>` as call metadata.
// Mutations act as the authenticated user; ids of "who is acting" are never taken from messages.
// Streaming RPCs (server-streaming) deliver real-time posts and notifications.

syntax = "proto3";

package socialnetwork;

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (User);
  rpc UpdateProfile(UpdateProfileRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (UserList);
  rpc SearchUsers(SearchUsersRequest) returns (UserList);
}

service PostService {
  rpc GetPost(GetPostRequest) returns (Post);
  rpc CreatePost(CreatePostRequest) returns (Post);
  rpc UpdatePost(UpdatePostRequest) returns (Post);
  rpc DeletePost(DeletePostRequest) returns (DeleteResponse);
  rpc ListUserPosts(ListUserPostsRequest) returns (PostList);
  rpc GetFeed(GetFeedRequest) returns (FeedResponse);
  // Server-streaming: new posts from the accounts you follow, as they are published.
  rpc StreamNewPosts(StreamRequest) returns (stream Post);
}

service FollowService {
  rpc Follow(FollowRequest) returns (User);
  rpc Unfollow(FollowRequest) returns (User);
  rpc GetFollowers(GetFollowersRequest) returns (UserList);
  rpc GetFollowing(GetFollowingRequest) returns (UserList);
}

service LikeService {
  rpc Like(LikeRequest) returns (Post);
  rpc Unlike(LikeRequest) returns (Post);
  rpc GetLikes(GetLikesRequest) returns (UserList);
}

service CommentService {
  rpc CreateComment(CreateCommentRequest) returns (Comment);
  rpc GetComments(GetCommentsRequest) returns (CommentList);
}

service GraphService {
  rpc GetShortestPath(PathRequest) returns (PathResponse);
  rpc GetMutualFriends(MutualFriendsRequest) returns (UserList);
  rpc GetRecommendations(RecommendationRequest) returns (RecommendationList);
}

service NotificationService {
  rpc GetUnreadCount(Empty) returns (CountResponse);
  // Server-streaming: your notifications, live.
  rpc StreamNotifications(StreamRequest) returns (stream Notification);
}

message Empty {}

message StreamRequest {}

message CountResponse {
  int32 count = 1;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar = 5;
  bool is_verified = 6;
  bool is_private = 7;
  int32 follower_count = 8;
  int32 following_count = 9;
  int32 post_count = 10;
  string created_at = 11;
}

message Media {
  string url = 1;
  string type = 2;
}

message Post {
  string id = 1;
  string author_id = 2;
  string content = 3;
  repeated Media media = 4;
  repeated string hashtags = 5;
  int32 like_count = 6;
  int32 comment_count = 7;
  int32 shares_count = 8;
  int32 reaction_count = 9;
  string created_at = 10;
  string updated_at = 11;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  string parent_id = 4;
  string content = 5;
  int32 like_count = 6;
  int32 reply_count = 7;
  string created_at = 8;
}

message Notification {
  string id = 1;
  string type = 2;
  string message = 3;
  bool read = 4;
  string sender_id = 5;
  string post_id = 6;
  string created_at = 7;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string two_factor_code = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByUsernameRequest {
  string username = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string bio = 2;
  string website = 3;
  string location = 4;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

message UserList {
  repeated User users = 1;
  int32 total = 2;
  string next_cursor = 3;
}

message GetPostRequest {
  string id = 1;
}

message CreatePostRequest {
  string content = 1;
  repeated string media_urls = 2;
}

message UpdatePostRequest {
  string id = 1;
  string content = 2;
}

message DeletePostRequest {
  string id = 1;
}

message DeleteResponse {
  bool success = 1;
}

message ListUserPostsRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message PostList {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message GetFeedRequest {
  int32 limit = 1;
  string cursor = 2;
  bool refresh = 3;
}

message FeedItem {
  Post post = 1;
  double score = 2;
  string reason = 3;
}

message FeedResponse {
  repeated FeedItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message FollowRequest {
  string user_id = 1;
}

message GetFollowersRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message GetFollowingRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message LikeRequest {
  string post_id = 1;
}

message GetLikesRequest {
  string post_id = 1;
  int32 limit = 2;
}

message CreateCommentRequest {
  string post_id = 1;
  string content = 2;
  string parent_id = 3;
}

message GetCommentsRequest {
  string post_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message CommentList {
  repeated Comment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message PathRequest {
  string to_user_id = 1;
}

message PathResponse {
  repeated string user_ids = 1;
  int32 distance = 2;
  bool found = 3;
}

message MutualFriendsRequest {
  string user_id = 1;
}

message RecommendationRequest {
  int32 limit = 1;
}

message Recommendation {
  User user = 1;
  int32 mutual_count = 2;
}

message RecommendationList {
  repeated Recommendation recommendations = 1;
}
