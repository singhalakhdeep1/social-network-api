# Full stack: API + web + MongoDB, Redis, Elasticsearch and Neo4j.
#   docker compose up --build                       -> social graph in Neo4j
#   GRAPH_PROVIDER=janusgraph docker compose --profile janusgraph up --build
services:
  api:
    build: .
    ports:
      - "4000:4000"
      - "50051:50051"
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3100
      CORS_ORIGINS: http://localhost:3100
      MONGODB_URI: mongodb://mongo:27017/social-network-api
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GRAPH_PROVIDER: ${GRAPH_PROVIDER:-neo4j}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-socialgraph123}
      JANUSGRAPH_URL: ws://janusgraph:8182/gremlin
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-change-me-message-key}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ./frontend-test
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3100:3100"
    depends_on:
      - api

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 20

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-socialgraph123}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      retries: 20

  janusgraph:
    image: janusgraph/janusgraph:1.0.0
    profiles: ["janusgraph"]
    ports:
      - "8182:8182"

volumes:
  mongo-data:
  es-data:
  neo4j-data:
  uploads:
